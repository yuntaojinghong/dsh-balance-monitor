name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 自检 (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 自检（语法 / 包清单 / 包名 / 版本号 / 密钥扫描）
        run: npm run verify

      - name: 校验 npm 发布内容
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          # 分发内容里不应出现 legacy 归档与开发脚本
          if grep -qE 'legacy/|scripts/' /tmp/pack.txt; then
            echo "::error::发布内容包含不应分发的文件（legacy/ 或 scripts/）"
            exit 1
          fi
          # 必须包含包清单与两份入口
          for f in lib/index.js lib/client.js cordis.patch.yml package.json; do
            grep -q "$f" /tmp/pack.txt || { echo "::error::发布内容缺少 $f"; exit 1; }
          done
          echo "OK：发布内容校验通过"
