name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 创建 GitHub Release —— 不依赖 npm 发布，任何情况下都会执行
  release:
    name: 创建 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: 校验版本号一致性（tag / package.json / CHANGELOG）
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const cl = fs.readFileSync("CHANGELOG.md", "utf8");
            const m = cl.match(/^##\s*\[(\d+\.\d+\.\d+)\]/m);
            const bad = [];
            if (pkg.version !== tag) bad.push(`package.json=${pkg.version}`);
            if (!m) bad.push("CHANGELOG.md 缺少版本条目");
            else if (m[1] !== tag) bad.push(`CHANGELOG=${m[1]}`);
            if (bad.length) {
              console.error(`版本号不一致：tag=v${tag}，${bad.join("，")}`);
              process.exit(1);
            }
            console.log(`版本号一致：v${tag}`);
          '

      - name: 发布前自检
        run: npm run verify

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false

  # 发布到 npm —— 仅在配置了 NPM_TOKEN 时执行；失败不影响上面的 Release
  npm:
    name: 发布到 npm（可选）
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      # 未配置 secret 时 `secrets.NPM_TOKEN` 的取值在不同上下文里可能是空串也可能是
      # null，用 `!= ''` / 真值判断都不可靠（曾导致此处被误判为「已配置」而执行
      # npm publish 失败）。因此把「有没有凭据」交给 shell 判定，再以 step 输出
      # 作为后续步骤唯一的闸门 —— 字符串比较不存在歧义。
      - name: 检查 NPM_TOKEN 是否已配置
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 未配置 NPM_TOKEN，跳过发布
        if: steps.token.outputs.configured != 'true'
        run: echo "::notice::未配置 NPM_TOKEN secret，跳过 npm 发布。配置后重跑本流程即可发布。"

      - name: 发布到 npm
        if: steps.token.outputs.configured == 'true'
        run: npm publish --access public
